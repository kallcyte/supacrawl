services:
  supacrawl:
    build: .
    ports:
      - "3001:3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env or shell}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - supacrawl-data:/app/data
    restart: unless-stopped

volumes:
  supacrawl-data:
