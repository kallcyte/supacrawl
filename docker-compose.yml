services:
  supacrawl:
    build: .
    ports:
      - "3456:3456"
      - "9090:9090"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env or shell}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - BETTER_AUTH_URL=https://supacrawl.kall.dev
      - PORT=3456
      - HOST=0.0.0.0

    volumes:
      - supacrawl-data:/app/data
    networks:
      - default
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    labels:
      - "traefik.http.routers.supacrawl.rule=Host(`supacrawl.kall.dev`)"
      - "traefik.http.routers.supacrawl.entrypoints=websecure"
      - "traefik.http.routers.supacrawl.tls.certresolver=letsencrypt"
      - "traefik.http.routers.supacrawl.service=supacrawl"
      - "traefik.http.services.supacrawl.loadbalancer.server.port=3456"
    restart: unless-stopped

volumes:
  supacrawl-data:

networks:
  dokploy-network:
    external: true
