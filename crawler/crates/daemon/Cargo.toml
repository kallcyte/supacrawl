[package]
name = "crawl-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Main binary: receives crawl jobs via stdin JSON-lines, executes, reports back"

[[bin]]
name = "crawl-daemon"
path = "src/main.rs"

[dependencies]
crawl-core = { path = "../core" }
crawl-fetcher = { path = "../fetcher" }
crawl-checker = { path = "../checker" }
crawl-storage = { path = "../storage" }
crawl-notifier = { path = "../notifier" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
url.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
axum.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }

