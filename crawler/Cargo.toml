[workspace]
members = [
    "crates/core",
    "crates/fetcher",
    "crates/checker",
    "crates/storage",
    "crates/notifier",
    "crates/daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "gzip", "brotli", "http2", "charset", "json"] }
rusqlite = { version = "0.35", features = ["bundled"] }
quick-xml = { version = "0.37", features = ["serialize"] }
scraper = "0.22"
encoding_rs = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ipnet = "2"
anyhow = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
axum = "0.8"
